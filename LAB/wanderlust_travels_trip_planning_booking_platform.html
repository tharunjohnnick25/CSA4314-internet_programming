<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wanderlust Travels — Trip Planning &amp; Booking Platform</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style>body{font-family:Inter,system-ui,sans-serif;background:#f8fafc;color:#0f172a}</style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2 font-bold text-lg text-slate-900">
        <i data-lucide="compass" class="w-5 h-5 text-teal-600"></i>
        <span>Wanderlust Travels</span>
      </div>
      <div class="flex bg-slate-100 p-1 rounded-xl gap-1">
        <button type="button" data-role="user" class="role-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-teal-600 text-white">Traveler</button>
        <button type="button" data-role="admin" class="role-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600">Admin</button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
    <!-- USER -->
    <section id="view-user" class="space-y-6">
      <div class="bg-gradient-to-r from-teal-700 to-cyan-700 rounded-2xl p-6 text-white">
        <h1 class="text-2xl font-bold">Plan &amp; Book Your Next Journey</h1>
        <p class="text-xs sm:text-sm text-teal-100 mt-1">Explore destinations, hotels &amp; hostels, local food guides, and curated travel routes.</p>
      </div>

      <div class="flex flex-wrap gap-2">
        <button type="button" data-utab="hotels" class="utab-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-teal-600 text-white">Hotels &amp; Hostels</button>
        <button type="button" data-utab="food" class="utab-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-white border border-slate-200 text-slate-700">Food Details</button>
        <button type="button" data-utab="routes" class="utab-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-white border border-slate-200 text-slate-700">Route Details</button>
        <button type="button" data-utab="bookings" class="utab-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-white border border-slate-200 text-slate-700">My Booked Accommodations</button>
      </div>

      <div id="user-content" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>

    <!-- ADMIN -->
    <section id="view-admin" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
        <h2 class="text-base font-bold">Manage Tourism, Hotel, Food &amp; Routes</h2>
        <form id="admin-item-form" class="space-y-2.5">
          <select id="ai-type" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white">
            <option value="hotels">Hotel / Hostel</option>
            <option value="food">Food Spot</option>
            <option value="routes">Travel Route</option>
          </select>
          <input id="ai-name" type="text" required placeholder="Title / Name" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm" />
          <input id="ai-loc" type="text" required placeholder="Destination / City" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm" />
          <input id="ai-price" type="number" min="0" required placeholder="Price / Avg Cost (₹)" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm" />
          <textarea id="ai-desc" rows="2" required placeholder="Details & highlights..." class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm"></textarea>
          <button type="submit" class="w-full py-2.5 rounded-xl bg-teal-600 text-white text-xs font-semibold">Publish Listing</button>
        </form>
      </div>

      <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
        <h2 class="text-base font-bold">Customer Bookings Overview</h2>
        <div id="admin-bookings-list" class="space-y-2.5"></div>
      </div>
    </section>
  </main>

  <div id="toast-box" class="fixed bottom-4 right-4 z-50 space-y-2"></div>

  <script>
    let state = {
      role: 'user',
      utab: 'hotels',
      hotels: [
        { id: 'H1', name: 'SeaBreeze Heritage Hostel', loc: 'Pondicherry', price: 1450, desc: 'Steps from Promenade Beach with rooftop cafe and Wi-Fi.' },
        { id: 'H2', name: 'Misty Hills Eco Resort', loc: 'Munnar', price: 3200, desc: 'Tea-estate cottages with guided valley treks and breakfast.' }
      ],
      food: [
        { id: 'F1', name: 'Coromandel Spice Kitchen', loc: 'Pondicherry', price: 450, desc: 'Coastal Franco-Tamil seafood & wood-fired dishes.' },
        { id: 'F2', name: 'Malabar Tea House', loc: 'Munnar', price: 280, desc: 'Traditional appam, stew, and estate-fresh cardamom tea.' }
      ],
      routes: [
        { id: 'R1', name: 'ECR Coastal Scenic Route', loc: 'Chennai → Pondicherry', price: 650, desc: '155 km coastal highway via Mahabalipuram (3.5 hrs).' },
        { id: 'R2', name: 'Western Ghats Tea Trail', loc: 'Kochi → Munnar', price: 900, desc: '130 km winding mountain pass past Cheeyappara Waterfalls.' }
      ],
      bookings: []
    };

    try { const s = localStorage.getItem('wanderlust_v1'); if (s) state = { ...state, ...JSON.parse(s) }; } catch (e) {}
    function save() { try { localStorage.setItem('wanderlust_v1', JSON.stringify(state)); } catch (e) {} }
    function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function toast(msg) {
      const el = document.createElement('div');
      el.className = 'bg-slate-900 text-white text-xs px-4 py-2.5 rounded-xl shadow-lg';
      el.textContent = msg;
      document.getElementById('toast-box').appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    function render() {
      document.getElementById('view-user').classList.toggle('hidden', state.role !== 'user');
      document.getElementById('view-admin').classList.toggle('hidden', state.role !== 'admin');
      document.querySelectorAll('.role-btn').forEach(b => {
        b.className = b.dataset.role === state.role ? 'role-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-teal-600 text-white' : 'role-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600';
      });
      document.querySelectorAll('.utab-btn').forEach(b => {
        b.className = b.dataset.utab === state.utab ? 'utab-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-teal-600 text-white' : 'utab-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-white border border-slate-200 text-slate-700';
      });

      const box = document.getElementById('user-content');
      if (state.utab === 'bookings') {
        box.innerHTML = state.bookings.map(b => `
          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-2">
            <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700">Confirmed</span>
            <h3 class="text-base font-bold">${esc(b.name)}</h3>
            <p class="text-xs text-slate-500">${esc(b.loc)} &bull; ₹${b.price}</p>
            <p class="text-[11px] font-mono text-slate-400">Booking ID: ${esc(b.bid)}</p>
          </div>
        `).join('') || '<p class="text-sm text-slate-500">No accommodations booked yet.</p>';
      } else {
        const items = state[state.utab] || [];
        box.innerHTML = items.map(item => `
          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm flex flex-col justify-between space-y-3">
            <div class="space-y-1.5">
              <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-teal-50 text-teal-700">${esc(item.loc)}</span>
              <h3 class="text-base font-bold">${esc(item.name)}</h3>
              <p class="text-xs text-slate-500">${esc(item.desc)}</p>
            </div>
            <div class="flex items-center justify-between pt-2 border-t border-slate-100">
              <span class="font-bold text-slate-900">₹${item.price}</span>
              ${state.utab === 'hotels' ? `<button type="button" data-book-id="${item.id}" class="px-3.5 py-1.5 rounded-lg bg-teal-600 text-white text-xs font-semibold">Book Accommodation</button>` : ''}
            </div>
          </div>
        `).join('');
        document.querySelectorAll('[data-book-id]').forEach(b => b.addEventListener('click', () => {
          const h = state.hotels.find(x => x.id === b.dataset.bookId);
          if (!h) return;
          state.bookings.unshift({ bid: 'WL-' + Math.floor(1000 + Math.random() * 8999), ...h });
          save(); toast(`Booked ${h.name}! View in My Booked Accommodations.`);
        }));
      }

      document.getElementById('admin-bookings-list').innerHTML = state.bookings.map(b => `
        <div class="p-3 rounded-xl border border-slate-200 flex justify-between items-center text-xs">
          <div><p class="font-bold">${esc(b.bid)} — ${esc(b.name)}</p><p class="text-slate-500">${esc(b.loc)}</p></div>
          <span class="font-bold text-teal-700">₹${b.price}</span>
        </div>
      `).join('') || '<p class="text-xs text-slate-500">No bookings yet.</p>';

      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.role-btn').forEach(b => b.addEventListener('click', () => { state.role = b.dataset.role; render(); }));
      document.querySelectorAll('.utab-btn').forEach(b => b.addEventListener('click', () => { state.utab = b.dataset.utab; render(); }));
      document.getElementById('admin-item-form').addEventListener('submit', e => {
        e.preventDefault();
        const type = document.getElementById('ai-type').value;
        state[type].unshift({
          id: type[0].toUpperCase() + Date.now(),
          name: document.getElementById('ai-name').value.trim(),
          loc: document.getElementById('ai-loc').value.trim(),
          price: Number(document.getElementById('ai-price').value),
          desc: document.getElementById('ai-desc').value.trim()
        });
        e.target.reset(); save(); render(); toast('Listing added!');
      });
      render();
    });
  </script>
</body>
</html>
