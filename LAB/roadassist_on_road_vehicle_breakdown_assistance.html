<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoadAssist — On-Road Vehicle Breakdown Assistance</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>body{font-family:Inter,system-ui,sans-serif;background:#f8fafc;color:#0f172a}</style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2 font-bold text-lg text-slate-900">
        <i data-lucide="wrench" class="w-5 h-5 text-amber-600"></i>
        <span>RoadAssist</span>
      </div>
      <div class="flex bg-slate-100 p-1 rounded-xl gap-1">
        <button type="button" data-role="user" class="role-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-600 text-white">Driver / User</button>
        <button type="button" data-role="mechanic" class="role-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600">Mechanic</button>
        <button type="button" data-role="admin" class="role-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600">Admin</button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
    <!-- USER -->
    <section id="view-user" class="space-y-6">
      <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex flex-col sm:flex-row gap-3">
        <input id="m-search" type="text" placeholder="Search licensed mechanics by location or specialty (e.g. Guindy, Velachery, Engine)..." class="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div id="mech-list" class="space-y-3"></div>
        <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm space-y-2">
          <h2 class="text-sm font-bold text-slate-900 flex items-center gap-2">
            <i data-lucide="map-pin" class="w-4 h-4 text-amber-600"></i>
            Live Mechanic Geo-Location Map
          </h2>
          <div id="map" class="w-full rounded-xl border border-slate-200" style="height: 320px;"></div>
        </div>
      </div>
    </section>

    <!-- MECHANIC -->
    <section id="view-mechanic" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
        <h2 class="text-base font-bold">Post / Manage Licensed Business</h2>
        <form id="mech-form" class="space-y-2.5">
          <input id="mf-name" type="text" required placeholder="Workshop / Mechanic Name" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm" />
          <input id="mf-loc" type="text" required placeholder="Area / Location (e.g. Adyar, Chennai)" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm" />
          <input id="mf-spec" type="text" required placeholder="Services (e.g. Towing, Battery, Engine)" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm" />
          <input id="mf-phone" type="tel" required placeholder="24/7 Contact Number" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm" />
          <button type="submit" class="w-full py-2.5 rounded-xl bg-amber-600 text-white text-xs font-semibold">Submit for Admin Approval</button>
        </form>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
        <h2 class="text-base font-bold">Customer Feedback</h2>
        <div id="mech-feedback-list" class="space-y-2"></div>
      </div>
    </section>

    <!-- ADMIN -->
    <section id="view-admin" class="hidden bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
      <h2 class="text-base font-bold">Approve Licensed Mechanics</h2>
      <div id="admin-mech-list" class="space-y-2.5"></div>
    </section>
  </main>

  <!-- Feedback Modal -->
  <div id="fb-modal" class="fixed inset-0 z-50 hidden bg-slate-900/50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="text-base font-bold">Post Mechanic Feedback</h3>
        <button type="button" id="close-fb" class="text-slate-400">&times;</button>
      </div>
      <form id="fb-form" class="space-y-2.5">
        <input id="fb-user" type="text" required placeholder="Your Name" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm" />
        <textarea id="fb-text" rows="3" required placeholder="Share your roadside assistance experience..." class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm"></textarea>
        <button type="submit" class="w-full py-2.5 rounded-xl bg-amber-600 text-white text-xs font-semibold">Submit Feedback</button>
      </form>
    </div>
  </div>

  <div id="toast-box" class="fixed bottom-4 right-4 z-50 space-y-2"></div>

  <script>
    let state = {
      role: 'user',
      fbTarget: null,
      mechanics: [
        { id: 'M1', name: 'Velachery Auto Rescue', loc: 'Velachery, Chennai', spec: 'Engine, Battery Jumpstart, Towing', phone: '+91 98401 44556', lat: 12.9815, lng: 80.2180, approved: true },
        { id: 'M2', name: 'Guindy Highway Motors', loc: 'Guindy, Chennai', spec: 'Flat Tire, Brake & Clutch Repair', phone: '+91 98402 77889', lat: 13.0067, lng: 80.2206, approved: true },
        { id: 'M3', name: 'OMR Express Mechanics', loc: 'Sholinganallur, Chennai', spec: '24/7 Towing & EV Diagnostics', phone: '+91 98403 99001', lat: 12.9010, lng: 80.2279, approved: false }
      ],
      feedbacks: [
        { mech: 'Velachery Auto Rescue', user: 'Karthik M.', text: 'Arrived in 20 minutes and fixed alternator belt on the spot.' }
      ]
    };

    try { const s = localStorage.getItem('roadassist_v1'); if (s) state = { ...state, ...JSON.parse(s) }; } catch (e) {}
    function save() { try { localStorage.setItem('roadassist_v1', JSON.stringify(state)); } catch (e) {} }
    function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function toast(msg) {
      const el = document.createElement('div');
      el.className = 'bg-slate-900 text-white text-xs px-4 py-2.5 rounded-xl shadow-lg';
      el.textContent = msg;
      document.getElementById('toast-box').appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    let map = null;
    let markers = [];
    function initMap() {
      if (typeof L === 'undefined' || map) return;
      map = L.map('map').setView([12.9716, 80.2206], 11);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Esri'
      }).addTo(map);
    }

    function render() {
      ['user', 'mechanic', 'admin'].forEach(r => document.getElementById(`view-${r}`).classList.toggle('hidden', state.role !== r));
      document.querySelectorAll('.role-btn').forEach(b => {
        b.className = b.dataset.role === state.role ? 'role-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-600 text-white' : 'role-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600';
      });

      const q = (document.getElementById('m-search').value || '').toLowerCase();
      const approved = state.mechanics.filter(m => m.approved && (!q || m.name.toLowerCase().includes(q) || m.loc.toLowerCase().includes(q) || m.spec.toLowerCase().includes(q)));

      document.getElementById('mech-list').innerHTML = approved.map(m => `
        <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm space-y-2">
          <div class="flex justify-between items-start">
            <div>
              <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700">Licensed &amp; Verified</span>
              <h3 class="text-base font-bold mt-1">${esc(m.name)}</h3>
              <p class="text-xs text-slate-500">${esc(m.loc)} &bull; ${esc(m.phone)}</p>
            </div>
            <button type="button" data-focus-geo="${m.id}" class="px-2.5 py-1 rounded-lg bg-amber-50 text-amber-800 text-xs font-semibold">Geo Location</button>
          </div>
          <p class="text-xs text-slate-600">${esc(m.spec)}</p>
          <div class="flex gap-2 pt-1">
            <button type="button" data-fb-mech="${esc(m.name)}" class="px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-semibold">Post Feedback</button>
          </div>
        </div>
      `).join('') || '<p class="text-sm text-slate-500">No licensed mechanics match that location.</p>';

      document.querySelectorAll('[data-focus-geo]').forEach(b => b.addEventListener('click', () => {
        const m = state.mechanics.find(x => x.id === b.dataset.focusGeo);
        if (m && map) map.setView([m.lat, m.lng], 14);
      }));
      document.querySelectorAll('[data-fb-mech]').forEach(b => b.addEventListener('click', () => {
        state.fbTarget = b.dataset.fbMech;
        document.getElementById('fb-modal').classList.remove('hidden');
      }));

      if (map) {
        markers.forEach(mk => mk.remove());
        markers = approved.map(m => L.marker([m.lat, m.lng]).addTo(map).bindPopup(`<b>${esc(m.name)}</b><br>${esc(m.loc)}`));
      }

      document.getElementById('mech-feedback-list').innerHTML = state.feedbacks.map(f => `
        <div class="p-3 rounded-xl border border-slate-200 text-xs">
          <p class="font-bold">${esc(f.mech)} <span class="font-normal text-slate-400">by ${esc(f.user)}</span></p>
          <p class="text-slate-600 mt-1">${esc(f.text)}</p>
        </div>
      `).join('');

      document.getElementById('admin-mech-list').innerHTML = state.mechanics.map(m => `
        <div class="p-3 rounded-xl border border-slate-200 flex justify-between items-center text-xs">
          <div><p class="font-bold">${esc(m.name)}</p><p class="text-slate-500">${esc(m.loc)} &bull; ${esc(m.spec)}</p></div>
          <button type="button" data-approve-mech="${m.id}" class="px-3 py-1.5 rounded-lg font-semibold ${m.approved ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-600 text-white'}">
            ${m.approved ? 'Approved' : 'Approve Mechanic'}
          </button>
        </div>
      `).join('');
      document.querySelectorAll('[data-approve-mech]').forEach(b => b.addEventListener('click', () => {
        const m = state.mechanics.find(x => x.id === b.dataset.approveMech);
        if (m) { m.approved = !m.approved; save(); render(); toast(`${m.name} ${m.approved ? 'approved' : 'pending'}.`); }
      }));

      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      document.querySelectorAll('.role-btn').forEach(b => b.addEventListener('click', () => {
        state.role = b.dataset.role; render();
        if (state.role === 'user' && map) setTimeout(() => map.invalidateSize(), 100);
      }));
      document.getElementById('m-search').addEventListener('input', render);
      document.getElementById('mech-form').addEventListener('submit', e => {
        e.preventDefault();
        state.mechanics.unshift({
          id: 'M' + Date.now(),
          name: document.getElementById('mf-name').value.trim(),
          loc: document.getElementById('mf-loc').value.trim(),
          spec: document.getElementById('mf-spec').value.trim(),
          phone: document.getElementById('mf-phone').value.trim(),
          lat: 12.97 + (Math.random() - 0.5) * 0.08,
          lng: 80.22 + (Math.random() - 0.5) * 0.08,
          approved: false
        });
        e.target.reset(); save(); render(); toast('Business submitted for Admin approval!');
      });
      document.getElementById('close-fb').addEventListener('click', () => document.getElementById('fb-modal').classList.add('hidden'));
      document.getElementById('fb-form').addEventListener('submit', e => {
        e.preventDefault();
        state.feedbacks.unshift({
          mech: state.fbTarget,
          user: document.getElementById('fb-user').value.trim(),
          text: document.getElementById('fb-text').value.trim()
        });
        e.target.reset(); document.getElementById('fb-modal').classList.add('hidden');
        save(); render(); toast('Feedback posted!');
      });
      render();
    });
  </script>
</body>
</html>
